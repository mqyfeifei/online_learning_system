server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式：找不到文件时回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口转发到后端容器
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /files/ {
        proxy_pass http://server:8080;
    }
}
