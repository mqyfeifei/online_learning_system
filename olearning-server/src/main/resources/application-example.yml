# 复制本文件为 application.yml（或直接改 application.yml）后填写自己的数据库密码
# 注意：真实密码不要提交到 GitHub
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/online_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 你的MySQL密码
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    secret: online-learning-platform-2026-mqy-secret-key
    expire: 7200000
  upload:
    path: ./upload/
    url-prefix: /files/
