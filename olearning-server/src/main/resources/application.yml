server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: olearning-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/online_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: root
    # 本地默认密码写在冒号后面；换机器 / 上云用环境变量 DB_PASSWORD 覆盖，不必改代码
    password: ${DB_PASSWORD:CHANGE_ME}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  web:
    resources:
      static-locations: classpath:/static/,file:${app.upload.path}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mqy.olearning.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 业务自定义配置
app:
  jwt:
    # HS256 要求密钥长度 >= 32 字节
    secret: online-learning-platform-2026-mqy-secret-key
    expire: 7200000
  upload:
    path: ./upload/
    url-prefix: /files/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.mqy.olearning: debug
